name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:standalone

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-standalone/index.html
          generate_release_notes: true

      - name: Remove source code archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Remove auto-generated source code archives
          gh release delete-asset "$TAG" "Source code (zip)" --quiet 2>/dev/null || true
          gh release delete-asset "$TAG" "Source code (tar.gz)" --quiet 2>/dev/null || true
